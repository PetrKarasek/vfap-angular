<div class="dashboard-container">
  <div class="header">
    <h1>Správa uživatelů</h1>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon>
      Přidat uživatele
    </button>
  </div>
  
  <mat-table [dataSource]="users" class="user-table">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
      <mat-cell *matCellDef="let row">{{row.id}}</mat-cell>
    </ng-container>
    
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>Jméno</mat-header-cell>
      <mat-cell *matCellDef="let row">{{row.name}}</mat-cell>
    </ng-container>
    
    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
      <mat-cell *matCellDef="let row">{{row.email}}</mat-cell>
    </ng-container>
    
    <ng-container matColumnDef="role">
      <mat-header-cell *matHeaderCellDef>Role</mat-header-cell>
      <mat-cell *matCellDef="let row">{{row.role}}</mat-cell>
    </ng-container>
    
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Akce</mat-header-cell>
      <mat-cell *matCellDef="let row">
        <button mat-icon-button color="warn" (click)="deleteUser(row.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>
    
    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
  
  @if (users.data.length === 0) {
  <div class="no-users">
    Žádní uživatelé nenalezeni. Zkuste někoho přidat!
  </div>
  }
</div>

<div class="dialog-overlay" *ngIf="dialogOpen" (click)="closeDialog()">
  <div class="dialog-content" (click)="$event.stopPropagation()">
    <h2>Nový uživatel</h2>
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Jméno a příjmení</mat-label>
      <input matInput [(ngModel)]="newUser.name" placeholder="Zadejte jméno">
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Emailová adresa</mat-label>
      <input matInput [(ngModel)]="newUser.email" type="email" placeholder="Zadejte email">
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Role</mat-label>
      <mat-select [(ngModel)]="newUser.role">
        <mat-option value="User">User</mat-option>
        <mat-option value="Admin">Admin</mat-option>
        <mat-option value="Manager">Manager</mat-option>
      </mat-select>
    </mat-form-field>
    
    <div class="dialog-actions">
      <button mat-button (click)="closeDialog()">Zrušit</button>
      <button mat-raised-button color="primary" (click)="addUser()" [disabled]="!newUser.name || !newUser.email">
        Uložit uživatele
      </button>
    </div>
  </div>
</div>
