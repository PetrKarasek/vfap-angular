<div class="container">
  <mat-card class="page-card mat-elevation-z3">
    <mat-card-header>
      <mat-card-title class="page-title">Kontakt</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="contact-grid">
        <div class="contact-info">
          <h3>Kontaktní informace</h3>
          <div class="info-item">
            <strong>Adresa:</strong><br>
            VFAP s.r.o.<br>
            Technologická 123<br>
            160 00 Praha 6
          </div>
          <div class="info-item">
            <strong>Telefon:</strong><br>
            +420 123 456 789
          </div>
          <div class="info-item">
            <strong>Email:</strong><br>
            info&#64;vfap.cz
          </div>
          <div class="info-item">
            <strong>Otevírací doba:</strong><br>
            Pondělí - Pátek: 9:00 - 18:00<br>
            Sobota, Neděle: Zavřeno
          </div>
        </div>

        <div class="contact-form">
          <h3>Kontaktní formulář</h3>
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Jméno a příjmení</mat-label>
              <input matInput formControlName="name" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Emailová adresa</mat-label>
              <input matInput type="email" formControlName="email" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Předmět</mat-label>
              <input matInput formControlName="subject" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Zpráva</mat-label>
              <textarea matInput formControlName="message" rows="5" required></textarea>
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit" class="submit-btn">
              Odeslat zprávu
            </button>
          </form>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
