<div class="login-container">
  <mat-card class="login-card">
    
    <mat-card-header style="display: block; text-align: center; margin-bottom: 10px;">
      <mat-card-title class="login-title">🔐 VFAP Přihlášení</mat-card-title>
      
      <p style="font-size: 13px; color: #757575; margin-top: 5px; margin-bottom: 0;">
        Login: admin&#64;admin.cz | Heslo: heslo123
      </p>
    </mat-card-header>
    
    <mat-card-content>
      <div *ngIf="error" class="error-alert">
        {{ error }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Heslo</mat-label>
          <input matInput type="password" formControlName="password">
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="submit-btn"
          [disabled]="loginForm.invalid || loading">
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          {{ loading ? 'Ověřování...' : 'Přihlásit' }}
        </button>
        
      </form>
    </mat-card-content>
  </mat-card>
</div>
